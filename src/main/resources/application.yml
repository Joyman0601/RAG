server:
  port: 19090

spring:
  application:
    name: rag-learning

logging:
  pattern:
    console: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %-5level [%X{requestId:-no-request}] %logger{36} - %msg%n"

rag:
  debug-enabled: ${RAG_DEBUG_ENABLED:false}
  chunk-size: ${RAG_CHUNK_SIZE:600}
  chunk-overlap: ${RAG_CHUNK_OVERLAP:100}
  search:
    top-k: ${RAG_SEARCH_TOP_K:3}
    score-threshold: ${RAG_SEARCH_SCORE_THRESHOLD:0.3}
  context:
    max-chars: ${RAG_CONTEXT_MAX_CHARS:3000}

llm:
  api-key: ${LLM_API_KEY:}
  base-url: ${LLM_BASE_URL:https://co.yes.vg}
  model: ${LLM_MODEL:gpt-5.5}
  temperature: ${LLM_TEMPERATURE:0.7}
  timeout-seconds: ${LLM_TIMEOUT_SECONDS:30}
  max-output-tokens: ${LLM_MAX_OUTPUT_TOKENS:800}
  max-input-chars: ${LLM_MAX_INPUT_CHARS:2000}
  embedding-base-url: ${LLM_EMBEDDING_BASE_URL:}
  embedding-api-key: ${LLM_EMBEDDING_API_KEY:}
  embedding-model: ${LLM_EMBEDDING_MODEL:text-embedding-3-small}
  embedding-timeout: ${LLM_EMBEDDING_TIMEOUT:30}
  proxy-host: ${LLM_PROXY_HOST:}
  proxy-port: ${LLM_PROXY_PORT:0}

agent:
  tool-rollout:
    tools:
      query_order:
        enabled: ${AGENT_TOOL_QUERY_ORDER_ENABLED:true}
        shadow-only: ${AGENT_TOOL_QUERY_ORDER_SHADOW_ONLY:false}
        auto-execute: ${AGENT_TOOL_QUERY_ORDER_AUTO_EXECUTE:true}
        requires-confirmation: ${AGENT_TOOL_QUERY_ORDER_REQUIRES_CONFIRMATION:false}
        max-calls-per-request: ${AGENT_TOOL_QUERY_ORDER_MAX_CALLS_PER_REQUEST:3}
      search_knowledge_base:
        enabled: ${AGENT_TOOL_SEARCH_KNOWLEDGE_BASE_ENABLED:true}
        shadow-only: ${AGENT_TOOL_SEARCH_KNOWLEDGE_BASE_SHADOW_ONLY:false}
        auto-execute: ${AGENT_TOOL_SEARCH_KNOWLEDGE_BASE_AUTO_EXECUTE:true}
        requires-confirmation: ${AGENT_TOOL_SEARCH_KNOWLEDGE_BASE_REQUIRES_CONFIRMATION:false}
        max-calls-per-request: ${AGENT_TOOL_SEARCH_KNOWLEDGE_BASE_MAX_CALLS_PER_REQUEST:3}
      cancel_order:
        enabled: ${AGENT_TOOL_CANCEL_ORDER_ENABLED:true}
        shadow-only: ${AGENT_TOOL_CANCEL_ORDER_SHADOW_ONLY:false}
        auto-execute: ${AGENT_TOOL_CANCEL_ORDER_AUTO_EXECUTE:false}
        requires-confirmation: ${AGENT_TOOL_CANCEL_ORDER_REQUIRES_CONFIRMATION:true}
        max-calls-per-request: ${AGENT_TOOL_CANCEL_ORDER_MAX_CALLS_PER_REQUEST:1}
  safety:
    max-input-length: ${AGENT_SAFETY_MAX_INPUT_LENGTH:2000}
    max-output-tokens: ${AGENT_SAFETY_MAX_OUTPUT_TOKENS:800}
    max-agent-steps: ${AGENT_SAFETY_MAX_AGENT_STEPS:3}
    max-agent-duration-ms: ${AGENT_SAFETY_MAX_AGENT_DURATION_MS:10000}
    allow-high-risk-auto-execute: ${AGENT_SAFETY_ALLOW_HIGH_RISK_AUTO_EXECUTE:false}
    require-tool-permission-code: ${AGENT_SAFETY_REQUIRE_TOOL_PERMISSION_CODE:true}
    require-tool-risk-level: ${AGENT_SAFETY_REQUIRE_TOOL_RISK_LEVEL:true}
    require-confirmation-for-high-risk: ${AGENT_SAFETY_REQUIRE_CONFIRMATION_FOR_HIGH_RISK:true}
    log-full-prompt: ${AGENT_SAFETY_LOG_FULL_PROMPT:false}
