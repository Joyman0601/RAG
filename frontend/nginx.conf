# Nginx 站点配置：RAG 演示环境
# 载入路径：/etc/nginx/conf.d/rag.conf（由 frontend/Dockerfile 拷入）
#
# 前置条件（首次上线）：
#   1. DNS: rag.chandlerblog.com A 记录 → 服务器公网 IP
#   2. 证书: 在宿主机先用 certbot standalone 发一次证书（临时停占用 80 的进程）
#      docker run --rm -p 80:80 -v /etc/letsencrypt:/etc/letsencrypt certbot/certbot \
#        certonly --standalone -d rag.chandlerblog.com \
#        --agree-tos -m <你的邮箱> --non-interactive
#   3. 之后由 docker-compose.prod.yml 把 /etc/letsencrypt 挂进 web 容器
#
# 续签（每 60 天 cron 一次）：
#   docker run --rm -p 80:80 -v /etc/letsencrypt:/etc/letsencrypt certbot/certbot renew
#   docker compose -f docker-compose.prod.yml exec web nginx -s reload

# --------------------------------------------------------------------
# Step 4 加固：限流 zone 声明
# /etc/nginx/conf.d/*.conf 由主 nginx.conf 在 http {} 里 include，
# 所以在这里的 server 块之前写 limit_req_zone 就是 http 上下文，合法。
#
# 参数说明：
#   rate=30r/m       稳态每 IP 每分钟 30 次（正常面试演示不会触发）
#   burst=20 nodelay 突发允许 20 次立即处理（不排队），超出直接 429
#   zone=rag_api:10m 10MB 状态表，够存约 16 万 IP
# --------------------------------------------------------------------
limit_req_zone  $binary_remote_addr zone=rag_api:10m  rate=30r/m;
limit_conn_zone $binary_remote_addr zone=rag_conn:10m;

# ---------- HTTP: ACME challenge + 全站 301 ----------
server {
    listen 80;
    listen [::]:80;
    server_name rag.chandlerblog.com;

    # certbot webroot 续签用
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # 其他请求全部 301 到 HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# ---------- HTTPS 主 server ----------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name rag.chandlerblog.com;

    # ----- TLS -----
    ssl_certificate     /etc/letsencrypt/live/rag.chandlerblog.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/rag.chandlerblog.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    # ----- 安全响应头 -----
    add_header Strict-Transport-Security "max-age=63072000" always;
    add_header X-Content-Type-Options    "nosniff"          always;
    add_header X-Frame-Options           "SAMEORIGIN"       always;
    add_header Referrer-Policy           "no-referrer"      always;

    # ----- gzip -----
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css text/xml application/json application/javascript application/xml+rss application/atom+xml image/svg+xml;

    # ----- 请求体大小上限：知识库上传接口在演示环境已关闭，这里保底 2M -----
    client_max_body_size 2m;

    # ----- /api/* 反代到 Spring Boot 后端 -----
    location /api/ {
        limit_req  zone=rag_api burst=20 nodelay;
        limit_conn rag_conn 20;
        # 429 附带 JSON 提示（避免 nginx 默认返回 html）
        limit_req_status 429;
        limit_conn_status 429;

        proxy_pass         http://app:19090;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   X-Request-Id      $request_id;

        # LLM/Agent 请求 <=60s，比后端 timeout 略大
        proxy_connect_timeout 10s;
        proxy_send_timeout    75s;
        proxy_read_timeout    75s;
        proxy_buffering       off;   # SSE / Agent 分步返回时打开流式

        # 显式暴露 X-Request-Id 便于前端联调
        add_header X-Request-Id $request_id always;
    }

    # ----- 静态前端（Vue SPA）-----
    root /usr/share/nginx/html;
    index index.html;

    # 静态资源强缓存
    location ~* \.(?:js|css|woff2?|ttf|eot|svg|png|jpe?g|gif|ico|webp)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA history fallback
    location / {
        try_files $uri $uri/ /index.html;
    }
}

# --------------------------------------------------------------------
# Langfuse 观测子域名（Step 5）
# 前置条件（首次上线）：
#   1. DNS: observability.rag.chandlerblog.com A 记录 → 服务器公网 IP
#   2. 证书: 与主域独立发一次（沿用 certbot standalone 流程，注意先停 web 容器占的 80）
#      docker compose -f docker-compose.prod.yml --env-file .env.prod stop web
#      docker run --rm -p 80:80 -v /etc/letsencrypt:/etc/letsencrypt certbot/certbot \
#        certonly --standalone -d observability.rag.chandlerblog.com \
#        --agree-tos -m <你的邮箱> --non-interactive
#      docker compose -f docker-compose.prod.yml --env-file .env.prod start web
#   3. Langfuse stack 已起（docker-compose.langfuse.yml），rag-net 内网可达 langfuse-server:3000
# --------------------------------------------------------------------

server {
    listen 80;
    listen [::]:80;
    server_name observability.rag.chandlerblog.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name observability.rag.chandlerblog.com;

    ssl_certificate     /etc/letsencrypt/live/observability.rag.chandlerblog.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/observability.rag.chandlerblog.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    add_header Strict-Transport-Security "max-age=63072000" always;
    add_header X-Content-Type-Options    "nosniff"          always;
    add_header Referrer-Policy           "no-referrer"      always;
    # 不设 X-Frame-Options：Langfuse 面板本身无嵌入需求，但避免和 Next.js 内部 iframe 冲突

    # Langfuse ingestion 批量事件 body 可能几 MB
    client_max_body_size 20m;

    location / {
        proxy_pass         http://langfuse-server:3000;
        proxy_http_version 1.1;

        # Next.js WebSocket / SSE / HMR
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";

        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        proxy_connect_timeout 10s;
        proxy_send_timeout    120s;
        proxy_read_timeout    120s;
        proxy_buffering       off;
    }
}
